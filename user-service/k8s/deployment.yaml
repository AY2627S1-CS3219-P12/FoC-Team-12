apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: foc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: arkanian4/foc-user-service:sha-4b846e8ef3113ca5cea3182b40bfdcbea383ad57-r39123715582-1
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: user-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: user_db
            - name: DB_USER
              value: user_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: DB_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: JWT_PRIVATE_KEY
            - name: USER_EVENTS_PUBLISHER_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_SASL_MECHANISM
              value: PLAIN
            - name: KAFKA_USERNAME
              value: user_service
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-kafka-client
                  key: KAFKA_PASSWORD
            - name: MAIL_PROVIDER
              value: sendgrid
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: user-mail-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: user-mail-secrets
                  key: SENDGRID_FROM_EMAIL
            # One-shot bootstrap: absent Secret leaves bootstrap disabled after setup.
            - name: ADMIN_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: user-admin-bootstrap
                  key: ADMIN_BOOTSTRAP_EMAIL
                  optional: true
            - name: ADMIN_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-admin-bootstrap
                  key: ADMIN_BOOTSTRAP_USERNAME
                  optional: true
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-admin-bootstrap
                  key: ADMIN_BOOTSTRAP_PASSWORD
                  optional: true
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
