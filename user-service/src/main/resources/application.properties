spring.application.name=user-service
server.port=8081
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.paths-to-match=/api/users/**,/.well-known/**
springdoc.swagger-ui.operations-sorter=method

app.jwt.issuer=friend-on-campus-user-service
app.jwt.audience=friend-on-campus-api
app.jwt.access-token-ttl=PT15M
app.jwt.key-id=user-service-rs256-1
app.jwt.private-key=${JWT_PRIVATE_KEY}

# Set MAIL_PROVIDER=sendgrid only when both SendGrid environment variables are supplied.
app.mail.provider=${MAIL_PROVIDER:noop}
app.mail.sendgrid-api-key=${SENDGRID_API_KEY:}
app.mail.from-email=${SENDGRID_FROM_EMAIL:}

# Deployment-only initial administrator bootstrap. Supply all three values or none.
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Always record activation events; enable transport only in environments with a reachable broker.
app.events.enabled=${USER_EVENTS_PUBLISHER_ENABLED:false}
app.events.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
app.events.security-protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
app.events.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
app.events.username=${KAFKA_USERNAME:user_service}
app.events.password=${KAFKA_PASSWORD:}
app.events.send-timeout-ms=${USER_EVENTS_SEND_TIMEOUT_MS:5000}
app.events.retry-delay-ms=${USER_EVENTS_RETRY_DELAY_MS:10000}
app.events.batch-size=${USER_EVENTS_BATCH_SIZE:10}
app.events.poll-interval-ms=${USER_EVENTS_POLL_INTERVAL_MS:5000}
app.events.initial-delay-ms=${USER_EVENTS_INITIAL_DELAY_MS:5000}
