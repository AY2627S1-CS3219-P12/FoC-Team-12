spring.application.name=user-service
server.port=8081
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.paths-to-match=/api/users/**,/.well-known/**
springdoc.swagger-ui.operations-sorter=method

app.jwt.issuer=friend-on-campus-user-service
app.jwt.audience=friend-on-campus-api
app.jwt.access-token-ttl=PT15M
app.jwt.key-id=user-service-rs256-1
app.jwt.private-key=${JWT_PRIVATE_KEY}

# Set MAIL_PROVIDER=sendgrid only when both SendGrid environment variables are supplied.
app.mail.provider=${MAIL_PROVIDER:noop}
app.mail.sendgrid-api-key=${SENDGRID_API_KEY:}
app.mail.from-email=${SENDGRID_FROM_EMAIL:}
