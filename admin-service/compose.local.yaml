# Standalone foundation database; does not modify the shared deployment.
services:
  admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - admin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  admin-data:
