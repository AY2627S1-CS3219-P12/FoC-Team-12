spring.application.name=admin-service
server.port=${ADMIN_PORT:8084}
management.endpoints.web.exposure.include=health
spring.datasource.url=jdbc:postgresql://${ADMIN_DB_HOST:localhost}:${ADMIN_DB_PORT:5432}/${ADMIN_DB_NAME:admin_db}
spring.datasource.username=${ADMIN_DB_USER:admin_user}
spring.datasource.password=${ADMIN_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.user.base-url=${ADMIN_USER_URL:http://localhost:8081}
app.user.jwk-set-uri=${ADMIN_USER_JWKS:http://localhost:8081/.well-known/jwks.json}
app.user.issuer=friend-on-campus-user-service
app.user.audience=friend-on-campus-api
app.chat.base-url=${ADMIN_CHAT_URL:http://localhost:8085}
app.service-auth.trusted-keys=${ADMIN_SERVICE_TRUSTED_KEYS:{}}
app.service-auth.key-id=${ADMIN_SERVICE_KEY_ID:admin-service-1}
app.service-auth.private-key=${ADMIN_SERVICE_PRIVATE_KEY:}
springdoc.paths-to-match=/api/admin/**,/internal/admin/**
app.actions.outcome-timeout-seconds=${ADMIN_ACTION_OUTCOME_TIMEOUT_SECONDS:30}
app.kafka.enabled=${ADMIN_KAFKA_ENABLED:false}
app.kafka.outbox-delay=${ADMIN_KAFKA_OUTBOX_DELAY:2000}
app.kafka.reconcile-seconds=${ADMIN_KAFKA_RECONCILE_SECONDS:60}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.admin.auto-create=false
