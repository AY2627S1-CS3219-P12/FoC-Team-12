spring.application.name=admin-service
server.port=${ADMIN_PORT:8084}
management.endpoints.web.exposure.include=health
spring.datasource.url=jdbc:postgresql://${ADMIN_DB_HOST:localhost}:${ADMIN_DB_PORT:5432}/${ADMIN_DB_NAME:admin_db}
spring.datasource.username=${ADMIN_DB_USER:admin_user}
spring.datasource.password=${ADMIN_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.user.base-url=${ADMIN_USER_URL:http://localhost:8081}
app.user.jwk-set-uri=${ADMIN_USER_JWKS:http://localhost:8081/.well-known/jwks.json}
app.user.issuer=friend-on-campus-user-service
app.user.audience=friend-on-campus-api
app.chat.base-url=${ADMIN_CHAT_URL:http://localhost:8085}
app.service-auth.trusted-keys=${ADMIN_SERVICE_TRUSTED_KEYS:{}}
app.service-auth.key-id=${ADMIN_SERVICE_KEY_ID:admin-service-1}
app.service-auth.private-key=${ADMIN_SERVICE_PRIVATE_KEY:}
springdoc.paths-to-match=/api/admin/**,/internal/admin/**
