spring.application.name=order-service
server.port=8082
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# User Service JWT contract (validated, never issued here). HS256 shared secret; sub=user UUID.
order.security.jwt.secret=${JWT_SECRET:}
order.security.jwt.issuer=${JWT_ISSUER:user-service}

springdoc.paths-to-match=/api/orders/**
springdoc.swagger-ui.operations-sorter=method
