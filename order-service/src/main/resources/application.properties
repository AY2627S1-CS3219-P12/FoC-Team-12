spring.application.name=order-service
server.port=8082
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# User Service JWT contract (validated, never issued here): RS256 via the published JWKS.
app.security.jwt.jwk-set-uri=${ORDER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${ORDER_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${ORDER_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/orders/**
springdoc.swagger-ui.operations-sorter=method

# Expire OPEN orders once now >= pickupDeadline. Set enabled=false to turn the job off.
app.orders.expiry.enabled=${ORDER_EXPIRY_ENABLED:true}
app.orders.expiry.interval-ms=${ORDER_EXPIRY_INTERVAL_MS:30000}

# Kafka (shared broker; see deploy/kafka/README.md and the event communication blueprint).
# ORDER_KAFKA_ENABLED=false runs without a broker: outbox rows wait unpublished.
app.kafka.enabled=${ORDER_KAFKA_ENABLED:true}
app.kafka.outbox.interval-ms=${ORDER_KAFKA_OUTBOX_INTERVAL_MS:1000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:order_service}" password="${KAFKA_PASSWORD:}";
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Order never creates topics; kafka-init does, and the order_service identity may not.
spring.kafka.admin.auto-create=false
