spring.application.name=order-service
server.port=8082
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# User Service JWT contract (validated, never issued here): RS256 via the published JWKS.
app.security.jwt.jwk-set-uri=${ORDER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${ORDER_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${ORDER_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/orders/**
springdoc.swagger-ui.operations-sorter=method

# Expire OPEN orders once now >= pickupDeadline. Set enabled=false to turn the job off.
app.orders.expiry.enabled=${ORDER_EXPIRY_ENABLED:true}
app.orders.expiry.interval-ms=${ORDER_EXPIRY_INTERVAL_MS:30000}
