spring.application.name=order-service
server.port=8082
# metrics needs an ADMIN session token (order.outbox.* gauges for the Kafka relay backlog).
management.endpoints.web.exposure.include=health,metrics

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# User Service JWT contract (validated, never issued here): RS256 via the published JWKS.
app.security.jwt.jwk-set-uri=${ORDER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${ORDER_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${ORDER_JWT_AUDIENCE:friend-on-campus-api}
app.service-auth.trusted-keys=${ORDER_SERVICE_TRUSTED_KEYS:{}}

springdoc.paths-to-match=/api/orders/**
springdoc.swagger-ui.operations-sorter=method

# Expire OPEN orders once now >= pickupDeadline. Set enabled=false to turn the job off.
app.orders.expiry.enabled=${ORDER_EXPIRY_ENABLED:true}
app.orders.expiry.interval-ms=${ORDER_EXPIRY_INTERVAL_MS:30000}
# A PENDING_CREDIT order Credit has not answered by min(pickupDeadline, createdAt + this) expires
# with CREDIT_RESERVATION_TIMEOUT (ISO-8601 duration). Checked by the same expiry job.
app.orders.credit-reservation-timeout=${ORDER_CREDIT_RESERVATION_TIMEOUT:PT2M}
# Every 5 min, report Order commands to Credit with no Credit outcome after the threshold (logs and
# order.credit.* gauges). Detection only: nothing is re-sent. Set enabled=false to turn it off.
app.orders.credit-reconciliation.enabled=${ORDER_CREDIT_RECONCILIATION_ENABLED:true}
app.orders.credit-reconciliation.after=${ORDER_CREDIT_RECONCILIATION_AFTER:PT10M}
app.orders.credit-reconciliation.interval-ms=${ORDER_CREDIT_RECONCILIATION_INTERVAL_MS:300000}

# Kafka (shared broker; see deploy/kafka/README.md and the event communication blueprint).
# ORDER_KAFKA_ENABLED=false runs without a broker: outbox rows wait unpublished.
app.kafka.enabled=${ORDER_KAFKA_ENABLED:true}
app.kafka.outbox.interval-ms=${ORDER_KAFKA_OUTBOX_INTERVAL_MS:1000}
# Rows a run locks while it sends them, and the failed attempts after which a row is logged as stuck.
app.kafka.outbox.batch-size=${ORDER_KAFKA_OUTBOX_BATCH_SIZE:20}
app.kafka.outbox.stuck-attempts=${ORDER_KAFKA_OUTBOX_STUCK_ATTEMPTS:10}
# OrderTransitioned on order.lifecycle.events for every committed transition (Notification, Chat).
# Off by default: enable only where kafka-init has created the topic and order_service's Write ACL.
app.kafka.lifecycle-events.enabled=${ORDER_LIFECYCLE_EVENTS_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:order_service}" password="${KAFKA_PASSWORD:}";
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Order never creates topics; kafka-init does, and the order_service identity may not.
spring.kafka.admin.auto-create=false

# Current User authorization (separate service identity).
app.user.base-url=${ORDER_USER_URL:http://localhost:8081}
app.service-auth.key-id=${ORDER_SERVICE_KEY_ID:order-service-1}
app.service-auth.private-key=${ORDER_SERVICE_PRIVATE_KEY:}

app.credit.base-url=${ORDER_CREDIT_URL:http://localhost:8083}
