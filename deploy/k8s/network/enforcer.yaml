# Adapted from kubernetes-sigs/kube-network-policies v1.1.2/install.yaml.
# Upstream tag still references image v1.1.1; deliberately use released v1.1.2 here.
# Policy-only agent: keeps Kindnet, kube-proxy, existing pod addresses and storage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-network-policies
  namespace: kube-system
  labels:
    foc/network-component: enforcer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-network-policies
  labels:
    foc/network-component: enforcer
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-network-policies
  labels:
    foc/network-component: enforcer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-policies
subjects:
  - kind: ServiceAccount
    name: kube-network-policies
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-network-policies
  namespace: kube-system
  labels:
    app: kube-network-policies
    foc/network-component: enforcer
spec:
  selector:
    matchLabels:
      app: kube-network-policies
  template:
    metadata:
      labels:
        app: kube-network-policies
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
      serviceAccountName: kube-network-policies
      containers:
        - name: kube-network-policies
          image: registry.k8s.io/networking/kube-network-policies:v1.1.2
          args:
            - /bin/netpol
            - --hostname-override=$(MY_NODE_NAME)
            - --v=2
            - --nfqueue-id=98
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN]
          volumeMounts:
            - name: nri
              mountPath: /var/run/nri
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
      volumes:
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: netns
          hostPath:
            path: /var/run/netns
            type: Directory
