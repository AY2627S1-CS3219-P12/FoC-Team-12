spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [user-service, order-service, credit-service, kafka, kafka-ui, kafka-init]
      ports:
        - protocol: TCP
          port: 9092
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9093
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: foc-kafka-clients
  namespace: foc-local
  labels:
    foc/network-isolation: v1
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [kafka-ui, kafka-init]
  policyTypes: [Ingress, Egress]
  # UI ingress remains denied from application pods. Authorized localhost
  # kubectl port-forward is administrative access, outside this pod boundary.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
