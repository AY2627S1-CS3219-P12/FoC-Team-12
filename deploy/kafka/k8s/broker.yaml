# Namespace is selected explicitly by the helper / kubectl -n, allowing isolated smoke tests.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: controller
      port: 9093
    - name: kafka
      port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0.kafka-headless:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
  KAFKA_LISTENERS: CONTROLLER://:9093,SASL_PLAINTEXT://:9092
  KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka-0.kafka-headless:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_SUPER_USERS: User:foc_admin;User:foc_broker
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_JMX_OPTS: -Djava.awt.headless=true
  KAFKA_BIN_DIR: /opt/foc-kafka-cli
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/foc-kafka/broker-entrypoint.sh]
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          envFrom:
            - configMapRef:
                name: kafka-config
            - secretRef:
                name: kafka-broker-secrets
          startupProbe:
            exec:
              command: [env, "KAFKA_HEAP_OPTS=-Xms32m -Xmx128m", /bin/bash, /opt/foc-kafka/probe.sh]
            periodSeconds: 30
            timeoutSeconds: 45
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [env, "KAFKA_HEAP_OPTS=-Xms32m -Xmx128m", /bin/bash, /opt/foc-kafka/probe.sh]
            periodSeconds: 60
            timeoutSeconds: 45
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /opt/foc-kafka
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
            - name: cli
              mountPath: /opt/foc-kafka-cli
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: kafka-scripts
        - name: cli
          configMap:
            name: kafka-cli
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
