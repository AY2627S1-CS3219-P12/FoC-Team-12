apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: foc-staging }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: foc-gateway-service:bootstrap
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8088 }]
          env:
            - { name: USER_SERVICE_URL, value: "http://user-service:8081" }
            - { name: SUPPLIER_SERVICE_URL, value: "http://supplier-service:8080" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service:8082" }
            - { name: CREDIT_SERVICE_URL, value: "http://credit-service:8083" }
            - { name: ADMIN_SERVICE_URL, value: "http://admin-service:8084" }
            - { name: CHAT_SERVICE_URL, value: "http://chat-service:8085" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8086" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1" }
          startupProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 6 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: foc-staging }
spec: { type: ClusterIP, selector: { app: gateway }, ports: [{ name: http, port: 8088, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: foc-staging }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: user-service
          image: foc-user-service:bootstrap
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: cloud-runtime, key: RDS_HOST } } }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: user_db }
            - { name: DB_USER, value: user_user }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: user-service-secrets, key: DB_PASSWORD } } }
            - { name: JWT_PRIVATE_KEY, valueFrom: { secretKeyRef: { name: user-service-secrets, key: JWT_PRIVATE_KEY } } }
            - { name: USER_SERVICE_TRUSTED_KEYS, valueFrom: { secretKeyRef: { name: user-service-secrets, key: USER_SERVICE_TRUSTED_KEYS } } }
            - { name: USER_EVENTS_PUBLISHER_ENABLED, value: "true" }
            - { name: USER_ADMIN_COMMANDS_ENABLED, value: "true" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: KAFKA_SECURITY_PROTOCOL, value: SASL_PLAINTEXT }
            - { name: KAFKA_SASL_MECHANISM, value: PLAIN }
            - { name: KAFKA_USERNAME, value: user_service }
            - { name: KAFKA_PASSWORD, valueFrom: { secretKeyRef: { name: user-kafka-client, key: KAFKA_PASSWORD } } }
            - { name: MAIL_PROVIDER, value: sendgrid }
            - { name: SENDGRID_API_KEY, valueFrom: { secretKeyRef: { name: user-mail-secrets, key: SENDGRID_API_KEY } } }
            - { name: SENDGRID_FROM_EMAIL, valueFrom: { secretKeyRef: { name: user-mail-secrets, key: SENDGRID_FROM_EMAIL } } }
            - { name: ADMIN_BOOTSTRAP_EMAIL, valueFrom: { secretKeyRef: { name: user-service-secrets, key: ADMIN_BOOTSTRAP_EMAIL, optional: true } } }
            - { name: ADMIN_BOOTSTRAP_USERNAME, valueFrom: { secretKeyRef: { name: user-service-secrets, key: ADMIN_BOOTSTRAP_USERNAME, optional: true } } }
            - { name: ADMIN_BOOTSTRAP_PASSWORD, valueFrom: { secretKeyRef: { name: user-service-secrets, key: ADMIN_BOOTSTRAP_PASSWORD, optional: true } } }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1" }
          startupProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /actuator/health, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 20, failureThreshold: 6 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
