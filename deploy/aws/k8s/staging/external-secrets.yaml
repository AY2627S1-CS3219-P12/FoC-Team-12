---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-kafka-client
  namespace: foc-staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: admin-kafka-client
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin_service" password="{{ .password }}";'
  data:
    - secretKey: password
      remoteRef: { key: foc/staging/kafka-broker-secrets, property: KAFKA_ADMIN_SERVICE_PASSWORD }
---
