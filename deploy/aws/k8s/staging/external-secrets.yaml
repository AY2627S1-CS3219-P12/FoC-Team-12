---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-ui-secrets
  namespace: foc-staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: kafka-ui-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka_ui" password="{{ .brokerPassword }}";'
        SPRING_SECURITY_USER_NAME: '{{ .loginUsername }}'
        SPRING_SECURITY_USER_PASSWORD: '{{ .loginPassword }}'
  data:
    - secretKey: brokerPassword
      remoteRef: { key: foc/staging/kafka-broker-secrets, property: KAFKA_UI_BROKER_PASSWORD }
    - secretKey: loginUsername
      remoteRef: { key: foc/staging/kafka-ui-secrets, property: KAFKA_UI_LOGIN_USERNAME }
    - secretKey: loginPassword
      remoteRef: { key: foc/staging/kafka-ui-secrets, property: KAFKA_UI_LOGIN_PASSWORD }
