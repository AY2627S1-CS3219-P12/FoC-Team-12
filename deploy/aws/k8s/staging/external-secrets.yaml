spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: kafka-admin-client, creationPolicy: Owner }
  data:
    - secretKey: KAFKA_ADMIN_PASSWORD
      remoteRef: { key: foc/staging/kafka-broker-secrets, property: KAFKA_ADMIN_PASSWORD }
---
