apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION_REPLACED_BY_DEPLOY_SCRIPT
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-secrets
  namespace: foc-staging
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: user-service-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: foc/staging/user-service-secrets }
---
