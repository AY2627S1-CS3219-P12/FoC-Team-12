apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: foc-static-1a
  labels:
    app.kubernetes.io/part-of: friend-on-campus
    app.kubernetes.io/managed-by: kubectl
spec:
  # Keep one baseline worker in this AZ. The existing EKS Auto Mode built-in pools continue to
  # provide demand-driven burst capacity above this fixed two-node floor.
  replicas: 1
  limits:
    # Permit one temporary replacement node during drift or AMI rotation.
    nodes: 2
  template:
    metadata:
      labels:
        friendoncampus.com/capacity: static
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [ap-southeast-1a]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [c5a.large, c6a.large, c7a.large, m5a.large, m6a.large, m7a.large]
  disruption:
    budgets:
      - nodes: "1"
---
