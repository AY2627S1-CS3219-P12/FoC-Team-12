spring.application.name=credit-service
server.port=8083
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_db}
spring.datasource.username=${DB_USER:credit_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.jwk-set-uri=${CREDIT_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${CREDIT_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${CREDIT_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/credits/**
springdoc.swagger-ui.operations-sorter=method

app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.user-events-topic=${KAFKA_USER_EVENTS_TOPIC:user.events}
app.kafka.order-events-topic=${KAFKA_ORDER_EVENTS_TOPIC:order.events}
app.kafka.credit-events-topic=${KAFKA_CREDIT_EVENTS_TOPIC:credit.events}
app.kafka.consumer-group=${KAFKA_CONSUMER_GROUP:credit-service}
app.kafka.outbox-delay=${KAFKA_OUTBOX_DELAY_MS:1000}
app.kafka.outbox-batch-size=${KAFKA_OUTBOX_BATCH_SIZE:50}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.ack-mode=manual_immediate
