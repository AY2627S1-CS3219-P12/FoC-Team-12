spring.application.name=credit-service
server.port=8083
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_db}
spring.datasource.username=${DB_USER:credit_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.jwk-set-uri=${CREDIT_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${CREDIT_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${CREDIT_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/credits/**
springdoc.swagger-ui.operations-sorter=method
