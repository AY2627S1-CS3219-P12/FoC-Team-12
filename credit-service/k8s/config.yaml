apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-service-config
  namespace: foc-local
data:
  DB_HOST: credit-db.foc-local.svc.cluster.local.
  DB_PORT: "5432"
  DB_NAME: credit_db
  DB_USER: credit_user
  CREDIT_JWT_JWK_SET_URI: http://user-service.foc-local.svc.cluster.local.:8081/.well-known/jwks.json
  CREDIT_JWT_ISSUER: friend-on-campus-user-service
  CREDIT_JWT_AUDIENCE: friend-on-campus-api
  KAFKA_ENABLED: "true"
  CREDIT_ADMIN_COMMANDS_ENABLED: "true"
  CREDIT_USER_URL: http://user-service.foc-local.svc.cluster.local.:8081
  KAFKA_BOOTSTRAP_SERVERS: kafka.foc-local.svc.cluster.local.:9092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_USERNAME: credit_service
  KAFKA_CONSUMER_GROUP: credit-service
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1"
