apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-service
  namespace: foc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-service
  template:
    metadata:
      labels:
        app: credit-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: credit-service
          image: arkanian4/foc-credit-service:sha-ce035eee7ff4eda6972fa4554714051b6314b209-r42501172138-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: credit-service-config
            - secretRef:
                name: credit-service-secrets
            - secretRef:
                name: credit-kafka-client
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
