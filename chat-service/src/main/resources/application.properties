spring.application.name=chat-service
server.port=${CHAT_PORT:8085}
management.endpoints.web.exposure.include=health
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_db}
spring.datasource.username=${DB_USER:chat_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.jwk-set-uri=${CHAT_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${CHAT_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${CHAT_JWT_AUDIENCE:friend-on-campus-api}

# Separate short-lived service assertions protect Admin-facing internal APIs.
app.service-auth.key-id=${CHAT_SERVICE_KEY_ID:chat-service-1}
app.service-auth.private-key=${CHAT_SERVICE_PRIVATE_KEY:}
app.service-auth.trusted-keys=${CHAT_SERVICE_TRUSTED_KEYS:{}}
app.admin.base-url=${CHAT_ADMIN_URL:http://localhost:8084}
app.user.base-url=${CHAT_USER_URL:http://localhost:8081}
app.order.base-url=${CHAT_ORDER_URL:http://localhost:8082}
app.credit.base-url=${CHAT_CREDIT_URL:http://localhost:8083}

app.kafka.enabled=${CHAT_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:chat_service}" password="${KAFKA_PASSWORD:}";
spring.kafka.consumer.group-id=chat-service-lifecycle
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.notification-outbox.interval-ms=${CHAT_NOTIFICATION_OUTBOX_INTERVAL_MS:1000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:chat_service}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
app.rabbit.enabled=${CHAT_RABBIT_ENABLED:true}

# Database remains the explicit local fallback. AWS staging sets this to s3 and obtains
# short-lived credentials from EKS Pod Identity through the AWS SDK default credential chain.
app.attachments.storage=${CHAT_ATTACHMENT_STORAGE:database}
app.attachments.s3.bucket=${CHAT_S3_BUCKET:}
app.attachments.s3.region=${CHAT_S3_REGION:${AWS_REGION:ap-southeast-1}}
app.attachments.s3.key-prefix=${CHAT_S3_KEY_PREFIX:attachments}

# Translation is disabled unless a provider is explicitly selected. Originals always remain in Chat.
app.translation.provider=${CHAT_TRANSLATION_PROVIDER:disabled}
app.translation.gemini.api-key=${GEMINI_API_KEY:}
app.translation.gemini.model=${CHAT_GEMINI_MODEL:gemini-3.5-flash-lite}
app.translation.max-attempts=${CHAT_TRANSLATION_MAX_ATTEMPTS:3}
app.translation.dispatch-delay-ms=${CHAT_TRANSLATION_DISPATCH_DELAY_MS:1500}

springdoc.paths-to-match=/api/chat/**
