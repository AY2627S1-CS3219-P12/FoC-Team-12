apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: foc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: arkanian4/foc-gateway-service:d3-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: SUPPLIER_SERVICE_URL
              value: http://supplier-service:8080
            - name: CREDIT_SERVICE_URL
              value: http://credit-service:8083
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
