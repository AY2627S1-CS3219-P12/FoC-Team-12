name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  user-backend:
    name: User backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: user-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-frontend:
    name: User frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  supplier-backend:
    name: Supplier backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: supplier-service/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  supplier-frontend:
    name: Supplier frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supplier-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
