name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    name: API gateway
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: gateway-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify gateway
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-backend:
    name: User backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: user-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-frontend:
    name: User frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  user-docker:
    name: User stack smoke test
    runs-on: ubuntu-24.04
    env:
      USER_DB_NAME: user_db
      USER_DB_USER: user_user
      USER_DB_PASSWORD: ci-user-password
      SUPPLIER_DB_NAME: supplier_db
      SUPPLIER_DB_USER: supplier_user
      SUPPLIER_DB_PASSWORD: ci-supplier-password
      MAIL_PROVIDER: noop
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate a throwaway JWT signing key
        run: |
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w 0)
          echo "JWT_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the gateway-backed User stack
        run: docker compose up -d --build gateway
      - name: Check live UI, JWKS, and protected API routing
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:8088/actuator/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://localhost:8088/actuator/health
          curl --fail --silent --output /dev/null http://localhost:8088/
          curl --fail --silent --output /dev/null http://localhost:8088/.well-known/jwks.json
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8088/api/users/me)
          test "$status" = 401
      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100 gateway user-service
      - name: Stop test stack
        if: always()
        run: docker compose down --remove-orphans

  supplier-backend:
    name: Supplier backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: supplier-service/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  supplier-frontend:
    name: Supplier frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supplier-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
