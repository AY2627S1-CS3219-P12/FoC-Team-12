name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-checks:
    name: CI workflow checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test CI scripts (image selection, release tags, Compose environment)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check every Compose environment provides compose.yaml's required variables
        run: python3 .github/scripts/compose_env_check.py
      - name: Validate GitHub Actions syntax and shell steps
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  image-plan:
    name: Select changed service images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-images: ${{ steps.plan.outputs.has-images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select services and unique SHA-based tag
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/image_plan.py

  kafka-infrastructure:
    name: Kafka infrastructure smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make Kafka scripts executable
        run: chmod +x deploy/kafka/*.sh
      - name: Verify topics, ACLs, authorization and persistence
        run: ./deploy/kafka/Test-LocalKafka.sh

  gateway:
    name: API gateway
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: gateway-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify gateway
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-backend:
    name: User backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: user-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-frontend:
    name: User frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  user-docker:
    name: User stack smoke test
    runs-on: ubuntu-24.04
    env:
      USER_DB_NAME: user_db
      USER_DB_USER: user_user
      USER_DB_PASSWORD: ci-user-password
      SUPPLIER_DB_NAME: supplier_db
      SUPPLIER_DB_USER: supplier_user
      SUPPLIER_DB_PASSWORD: ci-supplier-password
      CREDIT_DB_NAME: credit_db
      CREDIT_DB_USER: credit_user
      CREDIT_DB_PASSWORD: ci-credit-password
      ORDER_DB_NAME: order_db
      ORDER_DB_USER: order_user
      ORDER_DB_PASSWORD: ci-order-password
      MAIL_PROVIDER: noop
      KAFKA_ADMIN_PASSWORD: ci-kafka-admin-password
      KAFKA_BROKER_PASSWORD: ci-kafka-broker-password
      KAFKA_USER_SERVICE_PASSWORD: ci-kafka-user-password
      KAFKA_ORDER_SERVICE_PASSWORD: ci-kafka-order-password
      KAFKA_CREDIT_SERVICE_PASSWORD: ci-kafka-credit-password
      KAFKA_UI_BROKER_PASSWORD: ci-kafka-ui-broker-password
      KAFKA_UI_LOGIN_USERNAME: ci-kafka-viewer
      KAFKA_UI_LOGIN_PASSWORD: ci-kafka-ui-login-password
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate a throwaway JWT signing key
        run: |
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w 0)
          echo "JWT_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the gateway-backed User stack
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --build gateway; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            docker compose down --remove-orphans || true
            sleep 5
          done
      - name: Check live UI, JWKS, and protected API routing
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:8088/actuator/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://localhost:8088/actuator/health
          curl --fail --silent --output /dev/null http://localhost:8088/
          curl --fail --silent --output /dev/null http://localhost:8088/.well-known/jwks.json
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8088/api/users/me)
          test "$status" = 401
      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100 gateway user-service
      - name: Stop test stack
        if: always()
        run: docker compose down --remove-orphans

  supplier-backend:
    name: Supplier backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: supplier-service/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  order-backend:
    name: Order backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: order-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  supplier-frontend:
    name: Supplier frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supplier-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  credit-backend:
    name: Credit backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: credit-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: credit-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend and PostgreSQL integration
        run: ./mvnw --batch-mode --no-transfer-progress verify

  credit-frontend:
    name: Credit frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: credit-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: credit-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  credit-container:
    name: Credit container smoke test
    runs-on: ubuntu-24.04
    env:
      USER_DB_NAME: user_db
      USER_DB_USER: user_user
      USER_DB_PASSWORD: ci-user-password
      SUPPLIER_DB_NAME: supplier_db
      SUPPLIER_DB_USER: supplier_user
      SUPPLIER_DB_PASSWORD: ci-supplier-password
      CREDIT_DB_NAME: credit_db
      CREDIT_DB_USER: credit_user
      CREDIT_DB_PASSWORD: ci-credit-password
      ORDER_DB_NAME: order_db
      ORDER_DB_USER: order_user
      ORDER_DB_PASSWORD: ci-order-password
      MAIL_PROVIDER: noop
      KAFKA_ADMIN_PASSWORD: ci-kafka-admin-password
      KAFKA_BROKER_PASSWORD: ci-kafka-broker-password
      KAFKA_USER_SERVICE_PASSWORD: ci-kafka-user-password
      KAFKA_ORDER_SERVICE_PASSWORD: ci-kafka-order-password
      KAFKA_CREDIT_SERVICE_PASSWORD: ci-kafka-credit-password
      KAFKA_UI_BROKER_PASSWORD: ci-kafka-ui-broker-password
      KAFKA_UI_LOGIN_USERNAME: ci-kafka-viewer
      KAFKA_UI_LOGIN_PASSWORD: ci-kafka-ui-login-password
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway JWT signing key
        run: |
          key=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w 0)
          echo "JWT_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Build and start Credit Service with PostgreSQL
        run: docker compose up -d --build credit-service
      - name: Check health, dashboard and protected API
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:8083/actuator/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://localhost:8083/actuator/health
          curl --fail --silent --output /dev/null http://localhost:8083/credits
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8083/api/credits/me)
          test "$status" = 401
      - name: Show container status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100 credit-service credit-db
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    name: Publish ${{ matrix.service }}
    needs:
      - workflow-checks
      - image-plan
      - kafka-infrastructure
      - gateway
      - user-backend
      - user-frontend
      - user-docker
      - supplier-backend
      - supplier-frontend
      - order-backend
      - credit-backend
      - credit-frontend
      - credit-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image-plan.outputs.has-images == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$DOCKERHUB_USERNAME" != arkanian4 ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set DOCKERHUB_USERNAME to arkanian4 and configure DOCKERHUB_TOKEN with write access to the five foc-* repositories.'
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: arkanian4/foc-${{ matrix.service }}:sha-${{ github.sha }}-r${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
      - name: Show published image for manual deployment
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: arkanian4/foc-${{ matrix.service }}:sha-${{ github.sha }}-r${{ github.run_id }}-${{ github.run_attempt }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Published %s\n\n**Image:** %s\n\n**Digest:** %s\n\nThis does not update Minikube. Follow deploy/k8s/README.md to deploy this version.\n' \
            "$SERVICE" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
