name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  user-backend:
    name: User backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: user-service/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  user-frontend:
    name: User frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: user-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: user-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  user-docker:
    name: User Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        env:
          USER_DB_NAME: user_db
          USER_DB_USER: user_user
          USER_DB_PASSWORD: ci-user-password
          JWT_PRIVATE_KEY: ci-placeholder-key
          SUPPLIER_DB_NAME: supplier_db
          SUPPLIER_DB_USER: supplier_user
          SUPPLIER_DB_PASSWORD: ci-supplier-password
        run: docker compose config --quiet
      - name: Build user backend image
        run: docker build -f user-service/Dockerfile -t user-service:ci user-service
      - name: Build user frontend image
        run: docker build -f user-service/frontend/Dockerfile -t user-frontend:ci user-service/frontend

  supplier-backend:
    name: Supplier backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: supplier-service/pom.xml
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  supplier-frontend:
    name: Supplier frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supplier-service/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supplier-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
