apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: foc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notification-service
          image: arkanian4/foc-notification-service:sha-17ab15420ed3c2d3cbea9e91aff2ecabb924798d-r42496677595-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secrets
            - secretRef:
                name: notification-kafka-client
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
