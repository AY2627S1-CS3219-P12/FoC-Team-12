spring.application.name=notification-service
server.port=8086
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# User Service JWT contract (validated, never issued here): RS256 via the published JWKS.
app.security.jwt.jwk-set-uri=${NOTIFICATION_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${NOTIFICATION_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${NOTIFICATION_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/notifications/**

# Kafka (shared broker; see deploy/kafka/README.md and the event communication blueprint).
# NOTIFICATION_KAFKA_ENABLED=false runs without a broker: no events are consumed.
app.kafka.enabled=${NOTIFICATION_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:notification_service}" password="${KAFKA_PASSWORD:}";
# The producer only forwards rejected records to the DLT.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Notification never creates topics; kafka-init does, and the notification_service identity may not.
spring.kafka.admin.auto-create=false

# Retention (DESIGN.md "Decisions"): delete read notifications 30 days after reading, every
# notification 90 days after it was created, inbox rows after 30 days (never less: DLT replay window).
app.retention.enabled=${NOTIFICATION_RETENTION_ENABLED:true}
app.retention.read-notifications=${NOTIFICATION_RETENTION_READ:30d}
app.retention.all-notifications=${NOTIFICATION_RETENTION_ALL:90d}
app.retention.inbox=${NOTIFICATION_RETENTION_INBOX:30d}
app.retention.batch-size=${NOTIFICATION_RETENTION_BATCH_SIZE:500}
app.retention.interval-ms=${NOTIFICATION_RETENTION_INTERVAL_MS:3600000}
