spring.application.name=supplier-service
server.port=8080
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.jwk-set-uri=${SUPPLIER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${SUPPLIER_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${SUPPLIER_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/suppliers/**,/api/admin/suppliers/**
springdoc.swagger-ui.operations-sorter=method
