spring.application.name=supplier-service
server.port=8080
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.jwt.jwk-set-uri=${SUPPLIER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
app.security.jwt.issuer=${SUPPLIER_JWT_ISSUER:friend-on-campus-user-service}
app.security.jwt.audience=${SUPPLIER_JWT_AUDIENCE:friend-on-campus-api}

springdoc.paths-to-match=/api/suppliers/**,/api/admin/suppliers/**
springdoc.swagger-ui.operations-sorter=method

# Current User authorization (separate service identity).
app.user.base-url=${SUPPLIER_USER_URL:http://localhost:8081}
app.service-auth.key-id=${SUPPLIER_SERVICE_KEY_ID:supplier-service-1}
app.service-auth.private-key=${SUPPLIER_SERVICE_PRIVATE_KEY:}

# Uploaded supplier photos are disabled by default for local development. AWS staging enables
# private S3 storage and grants only the Supplier ServiceAccount access to its bucket.
app.images.storage=${SUPPLIER_IMAGE_STORAGE:disabled}
app.images.s3.bucket=${SUPPLIER_S3_BUCKET:}
app.images.s3.region=${SUPPLIER_S3_REGION:${AWS_REGION:ap-southeast-1}}
app.images.s3.key-prefix=${SUPPLIER_S3_KEY_PREFIX:images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
