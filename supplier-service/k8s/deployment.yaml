apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-service
  namespace: foc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplier-service
  template:
    metadata:
      labels:
        app: supplier-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: supplier-service
          image: arkanian4/foc-supplier-service:sha-7ff7340a86c4db7defae41b25267c53964066c86-r39623111914-1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: supplier-service-config
            - secretRef:
                name: supplier-service-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
